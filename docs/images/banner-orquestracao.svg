<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Orquestração de agentes para o Habit Tracker</title>
  <desc id="description">Ilustração com agentes conectados e um calendário de hábitos em quadrados verdes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b30"/>
      <stop offset="1" stop-color="#183746"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61d9b2"/>
      <stop offset="1" stop-color="#9ee56f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1077" cy="-10" r="180" fill="#3c8a75" opacity=".12"/>
  <circle cx="960" cy="330" r="185" fill="#83dd8a" opacity=".08"/>
  <text x="60" y="83" fill="#9ee56f" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">POC DE ENGENHARIA COM IA</text>
  <text x="60" y="143" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Agentes coordenados.</text>
  <text x="60" y="193" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Hábitos em evolução.</text>
  <rect x="60" y="226" width="395" height="2" fill="url(#accent)"/>
  <text x="60" y="259" fill="#c2d6dc" font-family="Arial, sans-serif" font-size="17">Escopo → tarefas → código → testes → revisão</text>
  <g stroke="#7fada8" stroke-width="2" opacity=".7">
    <path d="M725 90 L812 79 L888 132" fill="none"/>
    <path d="M725 90 L800 190 L888 132" fill="none"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="725" cy="90" r="32" fill="#25495a" stroke="#61d9b2" stroke-width="3"/>
    <text x="725" y="95" fill="#ffffff">IA</text>
    <circle cx="812" cy="79" r="23" fill="#30576a" stroke="#9ee56f" stroke-width="2"/>
    <text x="812" y="84" fill="#ffffff">ARQ</text>
    <circle cx="800" cy="190" r="23" fill="#30576a" stroke="#9ee56f" stroke-width="2"/>
    <text x="800" y="195" fill="#ffffff">QA</text>
  </g>
  <g transform="translate(888 72)">
    <rect width="252" height="174" rx="18" fill="#e9f8f0"/>
    <text x="19" y="29" fill="#23493c" font-family="Arial, sans-serif" font-size="16" font-weight="700">Meu progresso</text>
    <g>
      <rect x="20" y="48" width="25" height="25" rx="5" fill="#d4e5d9"/>
      <rect x="54" y="48" width="25" height="25" rx="5" fill="#a6dfad"/>
      <rect x="88" y="48" width="25" height="25" rx="5" fill="#57bd81"/>
      <rect x="122" y="48" width="25" height="25" rx="5" fill="#d4e5d9"/>
      <rect x="156" y="48" width="25" height="25" rx="5" fill="#2e9367"/>
      <rect x="190" y="48" width="25" height="25" rx="5" fill="#a6dfad"/>
      <rect x="20" y="82" width="25" height="25" rx="5" fill="#a6dfad"/>
