      <rect x="88" y="82" width="25" height="25" rx="5" fill="#d4e5d9"/>
      <rect x="122" y="82" width="25" height="25" rx="5" fill="#57bd81"/>
      <rect x="156" y="82" width="25" height="25" rx="5" fill="#a6dfad"/>
      <rect x="190" y="82" width="25" height="25" rx="5" fill="#2e9367"/>
      <rect x="20" y="116" width="25" height="25" rx="5" fill="#57bd81"/>
      <rect x="54" y="116" width="25" height="25" rx="5" fill="#d4e5d9"/>
      <rect x="88" y="116" width="25" height="25" rx="5" fill="#a6dfad"/>
      <rect x="122" y="116" width="25" height="25" rx="5" fill="#2e9367"/>
      <rect x="156" y="116" width="25" height="25" rx="5" fill="#57bd81"/>
      <rect x="190" y="116" width="25" height="25" rx="5" fill="#a6dfad"/>
