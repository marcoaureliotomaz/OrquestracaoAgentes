<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de orquestração dos agentes</title>
  <desc id="description">O pedido e os documentos alimentam o orquestrador; especialistas trabalham em tarefas pequenas; segurança, performance, QA e code review verificam a entrega.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#78989a" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1120" height="510" rx="20" fill="#f5f8f7"/>
  <text x="48" y="47" fill="#203c3b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Como a orquestração funciona</text>
  <g stroke="#78989a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M272 126 H322"/>
    <path d="M797 126 H847"/>
    <path d="M560 165 V204"/>
    <path d="M560 307 V345"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="81" width="224" height="85" rx="14" fill="#ffffff" stroke="#c9d9d5" stroke-width="2"/>
    <text x="68" y="113" fill="#183d3a" font-size="18" font-weight="700">1. Pedido</text>
    <text x="68" y="140" fill="#526b68" font-size="14">Objetivo e prioridades</text>

    <rect x="322" y="81" width="475" height="85" rx="14" fill="#173e4b"/>
    <text x="345" y="113" fill="#ffffff" font-size="18" font-weight="700">2. Agente orquestrador</text>
    <text x="345" y="140" fill="#d5e8e8" font-size="14">Lê o contexto, escolhe papéis e acompanha dependências</text>

    <rect x="847" y="81" width="225" height="85" rx="14" fill="#ffffff" stroke="#c9d9d5" stroke-width="2"/>
    <text x="867" y="113" fill="#183d3a" font-size="18" font-weight="700">Documentos</text>
    <text x="867" y="140" fill="#526b68" font-size="14">Escopo, backlog e tarefas</text>

    <text x="48" y="228" fill="#385c58" font-size="15" font-weight="700">3. Especialistas conforme a tarefa</text>
    <g fill="#e4f3ee" stroke="#b8dcd0">
      <rect x="48" y="245" width="184" height="62" rx="12"/>
      <rect x="258" y="245" width="184" height="62" rx="12"/>
      <rect x="468" y="245" width="184" height="62" rx="12"/>
      <rect x="678" y="245" width="184" height="62" rx="12"/>
      <rect x="888" y="245" width="184" height="62" rx="12"/>
    </g>
    <g fill="#1c5146" font-size="16" font-weight="700" text-anchor="middle">
      <text x="140" y="283">Produto + UI/UX</text>
      <text x="350" y="283">Arquitetura</text>
      <text x="560" y="283">Java</text>
      <text x="770" y="283">Angular</text>
      <text x="980" y="283">Infraestrutura</text>
    </g>

    <rect x="48" y="347" width="1024" height="72" rx="14" fill="#ffffff" stroke="#c9d9d5" stroke-width="2"/>
    <text x="70" y="375" fill="#183d3a" font-size="17" font-weight="700">4. Uma subtarefa → um commit pequeno</text>
    <text x="70" y="399" fill="#526b68" font-size="14">Código legível, teste relacionado e resultado verificável na branch da feature</text>

    <rect x="48" y="441" width="1024" height="44" rx="12" fill="#173e4b"/>
    <text x="560" y="469" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">5. Segurança → performance → QA → code review humano</text>
  </g>
</svg>
